<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">TempMon Logo</title>
  <desc id="desc">A futuristic glowing emblem with a circular gauge, heat core, and waveform, representing system temperature monitoring.</desc>

  <defs>
    <!-- Dark cyber background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"></stop>
      <stop offset="50%" stop-color="#060b18"></stop>
      <stop offset="100%" stop-color="#02040a"></stop>
    </linearGradient>

    <!-- Outer ring glow -->
    <radialGradient id="ringGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.85"></stop>
      <stop offset="55%" stop-color="#007bff" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#00111f" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Heat core gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffeaa7"></stop>
      <stop offset="40%" stop-color="#ff7675"></stop>
      <stop offset="80%" stop-color="#d63031"></stop>
      <stop offset="100%" stop-color="#6c0a17"></stop>
    </radialGradient>

    <!-- Gauge arc gradient (cool → hot) -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"></stop>
      <stop offset="45%" stop-color="#00ff9d"></stop>
      <stop offset="75%" stop-color="#f9ca24"></stop>
      <stop offset="100%" stop-color="#ff4757"></stop>
    </linearGradient>

    <!-- Waveform gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.1"></stop>
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.6"></stop>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.9"></stop>
      <stop offset="75%" stop-color="#ff9f43" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0.4"></stop>
    </linearGradient>

    <!-- Soft overall shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"></feDropShadow>
    </filter>

    <!-- Inner glow for core and ring overlay -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bgGrad)" filter="url(#softShadow)"></rect>

  <!-- Subtle outer ring glow -->
  <circle cx="64" cy="60" r="44" fill="url(#ringGlow)" opacity="0.55"></circle>

  <!-- Dark inner disc -->
  <circle cx="64" cy="60" r="36" fill="#05070d" stroke="#0b1c2c" stroke-width="2"></circle>

  <!-- Gauge arc (partial circle, bottom open) -->
  <path d="
    M 30 70
    A 36 36 0 0 1 64 24
    A 36 36 0 0 1 98 70" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round"></path>

  <!-- Gauge ticks -->
  <g stroke="#1f6feb" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- Left -->
    <line x1="36" y1="66" x2="31" y2="72"></line>
    <!-- Mid-left -->
    <line x1="46" y1="46" x2="41" y2="41"></line>
    <!-- Top -->
    <line x1="64" y1="38" x2="64" y2="30"></line>
    <!-- Mid-right -->
    <line x1="82" y1="46" x2="87" y2="41"></line>
    <!-- Right -->
    <line x1="92" y1="66" x2="97" y2="72"></line>
  </g>

  <!-- Heat core: stylized, slightly squashed circle -->
  <ellipse cx="64" cy="60" rx="16" ry="18" fill="url(#coreGrad)" filter="url(#innerGlow)"></ellipse>

  <!-- Vertical core slit / stylized thermometer stem -->
  <path d="
    M 60 46
    Q 64 42 68 46
    L 68 72
    Q 64 76 60 72 Z" fill="#05070d" opacity="0.92"></path>

  <!-- Inner core highlight -->
  <ellipse cx="64" cy="56" rx="7" ry="9" fill="#ffffff" opacity="0.18"></ellipse>

  <!-- Waveform band under the core (TempMon = monitoring signals) -->
  <g transform="translate(18,76)">
    <!-- Glow strip -->
    <rect x="0" y="8" width="92" height="18" fill="url(#waveGrad)" opacity="0.55"></rect>

    <!-- Actual waveform path -->
    <path d="
      M 0 17
      C 6 10, 10 11, 14 17
      S 22 24, 28 17
      S 36 10, 42 17
      S 50 24, 56 17
      S 64 10, 70 17
      S 78 24, 86 17
      S 92 10, 98 17" fill="none" stroke="url(#waveGrad)" stroke-width="2.2" stroke-linecap="round"></path>
  </g>

  <!-- Tiny “indicator dot” suggesting live status -->
  <circle cx="96" cy="32" r="4.2" fill="#00ff9d" stroke="#02130f" stroke-width="1.4"></circle>

  <!-- Optional brand text (comment out if you want icon-only) -->
  <!--
  <text x="64" y="116"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="14"
        letter-spacing="0.08em"
        fill="#e5f0ff"
        opacity="0.9">
    TEMPMON
  </text>
  -->
</svg>
